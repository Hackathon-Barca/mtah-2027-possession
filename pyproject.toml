[project]
name = "nolook"
version = "0.1.0"
description = "Team NoLook's entry to More than a Hack 2027, Phase 1: frame-level ball possession."
readme = "README.md"
license = "MIT"
requires-python = "==3.15.*"
dependencies = [
    "numpy",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nolook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root holds games.py, which is vendored from upstream and not part of the package.
pythonpath = ["."]
